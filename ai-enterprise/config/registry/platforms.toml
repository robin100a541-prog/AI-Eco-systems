# Plattformar i registret (PR 4, D-056). Hämtat från docs/channels.md (läst 2026-10-21), inget annat.
# Det som inte står där är "okänt", och okända belopp skrivs "null" (TOML saknar null). Avgifter i minsta enhet i plattformens valuta (USD-cent).
# Status "investigated" motsvarar UNDERSÖKT i channels.md. Godkännande görs av en grundare.

config_version = 1

[[platforms]]
key = "etsy"
status = "investigated"
name = "Etsy"
url = "https://www.etsy.com"
type = "product"
currency = "USD"
payment_terms = "okänt"
vat_responsibility = "marketplace: Etsy tar in moms som marknadsplats där det gäller; EU-detaljer ej bekräftade"
dac7 = "ja, om minst 30 försäljningar eller minst 2 000 euro per år"
ai_rules = "tillåtet som 'Seller-prompted AI creations'; AI-användning måste anges i annonsen; AI-promptpaket förbjudna"
automation_rules = "okänt: Etsy har ett API; villkoren för appgodkännande är inte lästa"
account_requirements = "kontot ägs och verifieras av en grundare (D-010)"
payout_terms = "okänt"
dependencies = []
risks = ["kontoavstängning", "återbetalningar", "IP-intrång", "beroende av en plattform", "Offsite Ads 12–15 % vid sådan försäljning"]
sources = [
  { url = "https://etsy.com/legal/creativity", read_on = "2026-10-21" },
  { url = "https://checkoutpage.com/blog/etsy-fees", read_on = "2026-10-21" },
]
[platforms.fees]
per_order_minor = "null"
percent_bp = 650
per_listing_minor = 20
monthly_minor = "null"
setup_minor = "null"
payout_minor = "null"
currency = "USD"
notes = "6,5 % transaktionsavgift och 0,20 USD per annons (förnyas var 4:e månad). Betalningsavgiften finns men beloppet står inte i channels.md: okänt."

