# Fas 7-piloten (masterprompten 2026-10-30). Plattformsdata ligger här och inte i src/ (D-056).
# Inga hemligheter. Ändras via PR.
config_version = 1
# Antagen växelkurs för beräkningar före första försäljningen. Vid import anger grundaren den riktiga kursen.
usd_sek = 10.5


[platform]
slug = "gumroad"
name = "Gumroad"
currency = "USD"
fee_percent = 10        # procent av priset per försäljning
fee_fixed_cents = 50    # fast avgift per försäljning, i cent

# Kolumnnamn i plattformens försäljnings-CSV (små bokstäver; första som finns används).
[csv]
id = ["purchase id", "sale id", "id", "order id"]
date = ["purchase date", "sale date", "date", "created at"]
price = ["sale price ($)", "sale price", "price", "price ($)"]
fee = ["fees ($)", "gumroad fee", "fee", "fees"]
refunded = ["refunded?", "refunded", "is refunded"]

# Fas 7a (Robin 2026-10-30): plattformarnas avgifter i baspunkter (1 % = 100) och fast avgift i cent.
# Koden räknar alla pengar; modellen ger bara pris och uppskattad försäljning.
[fees.gumroad]
percent_bp = 1000
fixed_cents = 50
[fees.etsy]
percent_bp = 950      # 6,5 % transaktion + cirka 3 % betalning
fixed_cents = 45      # 0,20 USD per annons + 0,25 USD betalning
[fees.fiverr]
percent_bp = 2000
fixed_cents = 0
[fees.payhip]
percent_bp = 500
fixed_cents = 0

[discovery]
min_ideas = 10
min_signals = 2                    # minst två belagda signaler om efterfrågan per idé
min_expected_value_cents = 15000   # förväntat netto på 90 dagar (USD-cent) som en idé måste nå
max_fetches = 40                   # högst så många hämtningar per körning (research.toml har dagskvoten)
# Sökadresser: {q} byts mot ett sökord ur founders.toml (URL-kodat).
search_urls = [
  "https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=votes&q={q}&site=video&pagesize=25",
  "https://itch.io/search?q={q}",
  "https://hn.algolia.com/api/v1/search?query={q}&hitsPerPage=20",
  "https://www.etsy.com/search?q={q}",
]

# Opportunity Scout (Robin 2026-10-30): körs varje dygn i scout.yml.
[scout]
max_fetches = 20        # hämtningar för ny research per körning (research.toml har dagskvoten för alla)
deepen_top = 3          # så många av de bästa idéerna fördjupas med egna sökningar
deepen_fetches = 2      # hämtningar per fördjupad idé
propose_max = 2         # högst så många nya förslag till CEO per körning
stale_days = 14         # en idé som inte setts på så många dagar stoppas som inaktuell

# API-källor med nyckel ur GitHub-hemligheter. Saknas nyckeln hoppas källan över. Nyckeln skickas bara som
# rubrik till API:ets egen värd och sparas aldrig (WebReader secret_headers).
[[scout.apis]]
name = "YouTube"
env = "YOUTUBE_API_KEY"
header = "X-goog-api-key"
url = "https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=10&q={q}"

[[scout.apis]]
name = "Etsy"
env = "ETSY_API_KEY"
header = "x-api-key"
url = "https://openapi.etsy.com/v3/application/listings/active?limit=20&keywords={q}"
