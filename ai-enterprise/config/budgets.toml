# Departementsbudgetar (ER-17, D-026, D-047). Ändras bara av båda grundarna (D-019 punkt 3).
#
# mode = "capital" (D-047): varje departement får en andel (procent) av det disponibla kapitalet,
# det vill säga likvida medel minus skyddad reserv, åtaganden och reserverad skatt. Det finns ingen period.
# Budgeten växer med vinsten och krymper vid förlust. Plattformsavgifter (Etsy, Gumroad) är
# försäljningskostnader och räknas inte mot departementet. Högst MAX_DEPARTMENT_BUDGET per departement.
# Andelarna summerar till högst 100 %; resten är en buffert som ingen får använda.
#
# SIMULERADE VÄRDEN för ett startkapital på 500 kr.

config_version = 1
mode = "capital"

[departments.research]
share = 40
max_commitment = 5_000
risk_room = "medium"
purpose = "Marknadsanalys, mallar och små försök med nya kanaler"

[departments.executive]
share = 5
max_commitment = 1_000
risk_room = "low"
purpose = "Samordning och verktyg för CEO"

[departments.finance]
share = 5
max_commitment = 1_000
risk_room = "low"
purpose = "Bokföring och betalningsverktyg"

[departments.risk]
share = 2
max_commitment = 500
risk_room = "low"
purpose = "Riskanalys"

[departments.compliance]
share = 2
max_commitment = 500
risk_room = "low"
purpose = "Juridisk granskning och villkor"

[departments.audit]
share = 2
max_commitment = 500
risk_room = "low"
purpose = "Oberoende granskning"
