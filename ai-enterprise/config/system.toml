# Systemkonfiguration (FR-02). Kontrollera med:  python -m aie check-config
# Inga hemligheter här (SR-10). API-nycklar läses från miljövariabler.

config_version = 1

# "sim" = simulering i valutan SIM. "prod" = verkligt kapital (först i Fas 7).
environment = "sim"

# Sökvägar relativt repots rot. Innehållet är driftdata och gitignorerat.
data_dir = "data"
log_dir = "logs"

# Lägsta nivå som loggas: DEBUG, INFO, WARNING, ERROR eller CRITICAL. Saknas = INFO.
log_level = "INFO"

# Grundarnas ID:n (nivå 0). Används av godkännandekön: `python -m aie approvals ...` (D-019, D-021).
founders = ["robin", "yorgo"]

# I sim måste valutan vara SIM (ER-15). I prod en verklig valuta, t.ex. SEK (Q-03).
base_currency = "SIM"
