# Q4-idéer för print-on-demand (arbetsorder 04, D-066). Utkast, inget är publicerat.
# Kör kalkylen och spärren med:  python -m aie q4 --as yorgo   (skriver products/q4/<idé>/ och REPORT.md)
#
# Motiven är systemets egna: typografi med egen pixelfont eller egna geometriska mönster (aie.pod.designs).
# Inga varumärken, figurer, kända personer eller kopierade motiv; aie.pod.rules stoppar sådant.
# Belopp i USD-cent. Priserna är våra egna förslag.

config_version = 1

# Kostnader per produkttyp. ANTAGANDEN tills Printifys API ger verkliga siffror:
# - shipping_us: standardfrakt första varan till USA. Ersätts av printify.read (v2-frakten) när verktyget finns (#172).
# - base_cost: baspriset finns inte i katalogens API; det läses från `cost` på ett opublicerat utkast (printify.draft, D-069).
#   Värdena är medvetet höga, så att kalkylen hellre underskattar marginalen.
# print_px: tryckytans storlek i pixlar (300 dpi). Ersätts av katalogens `placeholders` när den är läst.
[products.tee]
search = "unisex heavy cotton tee"
base_cost = 1_100
shipping_us = 500
print_px = [4500, 5400]
cost_source = "antagande: övre gräns för Bella+Canvas 3001 (10,98 USD) och Gildan 5000 (8,80 USD) i tredjepartskällor 2026, inte Printifys API"

[products.sweatshirt]
search = "crewneck sweatshirt"
base_cost = 1_900
shipping_us = 800
print_px = [4500, 5400]
cost_source = "antagande utan källa: ingen verifierad siffra hittad"

[products.mug]
search = "ceramic mug"
base_cost = 700
shipping_us = 750
print_px = [2700, 1050]
cost_source = "antagande: över de 4,25–6,21 USD som tredjepartskällor anger för en 11 oz mugg, inte Printifys API"

[products.ornament]
search = "ornament"
base_cost = 800
shipping_us = 500
print_px = [1200, 1200]
cost_source = "antagande utan källa: ingen verifierad siffra hittad"

[products.tote]
search = "tote bag"
base_cost = 1_100
shipping_us = 550
print_px = [3600, 3600]
cost_source = "antagande utan källa: ingen verifierad siffra hittad"

[products.poster]
search = "poster"
base_cost = 1_450
shipping_us = 650
print_px = [3600, 5400]
cost_source = "antagande: övre gräns för en 18 × 24 matt affisch (10,20–14,50 USD) i tredjepartskällor 2026"

[demand]
# ANTAGANDE för alla idéer tills Etsy- och Pinterest-signaler finns (etsy.read, pinterest.trends).
visitors_per_day = 10
conversion_bp = 150
refund_bp = 300
source = "antagande: ingen uppmätt efterfrågan; ersätts av Etsys signaler och sedan av verkliga utfall (results import)"
founder_hours_per_week = 0.25   # kundmeddelanden på Etsy kan inte skötas via API:t (D-069)

