# Produktutkast som initiativ i registret (arbetsorder 02, PR 11). Status "idea": inget är granskat eller godkänt.
# Importera till en databas med:  python -m aie registry import --as <grundare>  (efter att filen kopierats till
# config/registry/) eller provkör bedömningen enligt products/README.md.
#
# Alla siffror för efterfrågan är ANTAGANDEN. Det finns ingen uppmätt efterfrågan. Den mäts först när en grundare
# har publicerat manuellt och importerat utfallen (python -m aie results import, D-062).
# Pris i plattformens valuta (USD-cent). Grundarnas tid räknas som kostnad (100 kr per timme, simulation.toml).

config_version = 1

