# Paketmetadata. Inga beroenden (D-002): endast Pythons standardbibliotek.
# Paketet körs direkt från källkoden (se docs/setup.md) och installeras inte,
# därför finns ingen [build-system]-sektion (den skulle hämta setuptools).
[project]
name = "aie"
version = "0.4.0"
description = "AI Enterprise System — AI-företag vars skyddsräcken upprätthålls av kod"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Valfritt: Pillow (licens HPND) bara för src/aie/pod/design (testläget, LANSERING-Q4.md). Resten av koden
# använder bara standardbiblioteket.
pod-design = ["pillow>=12.2"]
