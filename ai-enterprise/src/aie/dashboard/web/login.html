<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sign in · Command center</title>
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="login-page">
<main class="panel login">
  <div class="logo"><span class="logo-mark"><svg class="icon" aria-hidden="true"><use href="/assets/icons/lucide-sprite.svg#i-radar"></use></svg></span>Command center</div>
  <div class="row"><span class="pill sim">$label</span><span class="muted mono">local server</span></div>
  <h1>Sign in.</h1>
  $hint
  $error
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="$csrf">
    <label class="label" for="founder">Founder</label>
    <select id="founder" name="founder">$options</select>
    <label class="label" for="code">Access code</label>
    <input id="code" name="code" type="password" autocomplete="current-password" required>
    <button type="submit" class="btn primary">Sign in</button>
  </form>
</main>
</body>
</html>
