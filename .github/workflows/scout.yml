# Opportunity Scout (Robin 2026-10-30): en cykel i veckan (måndagar, sedan 2026-11-06) och med knappen "Run workflow".
# Bara gratismodeller via LLMGateway (Groq), aldrig Claude. Nycklarna finns bara i scoutsteget.
# Scouten skapar aldrig konton, godkänner aldrig villkor, betalar aldrig och publicerar aldrig (D-011, §6).
name: scout

on:
  schedule:
    - cron: "47 5 * * 1"  # en gång i veckan, måndagar (lansering Q4, Yorgo 2026-11-04)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ai-enterprise
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta scoutens databas
        uses: actions/cache/restore@v4
        with:
          path: ai-enterprise/data
          key: scout-${{ github.run_id }}
          restore-keys: scout-
      - name: Hämta från KV om cachen saknas
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: bash scripts/state.sh pull scout data/sim.db
      - name: Scoutcykel
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        run: |
          python -m aie init
          python -m aie scout run --as robin --agents groq 2>&1 | tee "$RUNNER_TEMP/scout.txt" || [ ${PIPESTATUS[0]} -eq 3 ]
      - name: Spara scoutens databas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ai-enterprise/data
          key: scout-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Spara den krypterade kopian i KV
        if: always()
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: bash scripts/state.sh push scout data/sim.db
      # Inget data committas till repot (beslut 8, Command Center 2026-11-09): registret och notisen sparas som
      # artefakt. Tidigare öppnades en PR med docs/opportunities och QUESTIONS-FOR-FOUNDERS.md.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-${{ github.run_id }}
          path: |
            ai-enterprise/docs/opportunities/
            ai-enterprise/docs/QUESTIONS-FOR-FOUNDERS.md
            ${{ runner.temp }}/scout.txt
          retention-days: 30
