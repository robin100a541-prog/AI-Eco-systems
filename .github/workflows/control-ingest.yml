# control-ingest (Command Center Del 4, D-089): utför grundarnas knapptryck.
# - Startas av functions/api/action.js via workflow_dispatch (en finkornig token med bara rätt att starta workflows).
# - Läser och tömmer kön i Cloudflare KV, validerar varje beslut, anropar kärnans funktioner
#   (`python -m aie control ingest`), loggar i revisionsloggen med grundarens mejl och publicerar en ny snapshot.
# - Samma concurrency-grupp som company-daily: de två ändrar samma databas och får aldrig köra samtidigt.
#   GitHub behåller bara en väntande körning per grupp. Om den dagliga cykeln därför har fallit bort startas den
#   om i sista steget, så att ett knapptryck aldrig kostar en dags körning.
# - Inga indata från webbläsaren når den här filen: workflowen tar inga inputs, och allt läses ur kön och valideras.
name: control-ingest

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write  # bara för att starta om company-daily i sista steget

concurrency:
  group: company-daily
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: ai-enterprise
    env:
      PYTHONPATH: src
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bara sim
        run: |
          python -c "from aie.config import load_config; c = load_config('config'); assert c.system.environment == 'sim' and c.risk.currency == 'SIM'"
      - name: Hämta företagets databas
        uses: actions/cache/restore@v4
        with:
          path: ai-enterprise/data
          key: company-${{ github.run_id }}
          restore-keys: company-
      - name: Hämta från KV om cachen saknas
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: bash scripts/state.sh pull company data/sim.db
      - name: Utför besluten i kön
        env:
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
        run: |
          python -m aie init
          python -m aie control ingest 2>&1 | tee "$RUNNER_TEMP/ingest.txt"
      - name: Publicera snapshoten
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m aie publish || true
      - name: Spara den krypterade kopian i KV
        if: always()
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: bash scripts/state.sh push company data/sim.db
      - name: Spara företagets databas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ai-enterprise/data
          key: company-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Sammanfattning
        if: always()
        run: |
          { echo '```'; cat "$RUNNER_TEMP/ingest.txt" 2>/dev/null | grep -v '@' || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Starta om den dagliga cykeln om den föll bort
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Efter 04:23 UTC ska dagens cykel ha körts eller stå på tur. Finns ingen körning i dag startas en.
          now=$(date -u +%H%M); today=$(date -u +%F)
          if [ "$now" -lt 0500 ]; then echo "före dagens cykel"; exit 0; fi
          n=$(gh run list --repo "$REPO" --workflow company-daily.yml --created ">=$today" --json status,conclusion \
              --jq '[.[] | select(.conclusion != "cancelled")] | length')
          if [ "$n" = "0" ]; then echo "dagens cykel saknas; startar den"; gh workflow run company-daily.yml --repo "$REPO" -f verify_only=false; else echo "dagens cykel finns ($n)"; fi
