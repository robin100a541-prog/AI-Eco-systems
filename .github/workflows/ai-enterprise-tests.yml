# Kör ai-enterprise-testerna (D-016: gröna tester före merge). Actions-minuter (2026-11-12, inför privat repo):
# - En Python-version (3.12) både på PR mot main och vid push till main. Tidigare kördes också 3.11 på PR.
# - Grenskyddet på main kräver fortfarande kontrollen "unittest (Python 3.11)". Jobbet med det namnet hoppas därför
#   alltid över: en överhoppad kontroll räknas som godkänd och kostar inga minuter. När Robin har tagit bort
#   kontrollen ur grenskyddet (Settings > Branches) kan jobbet `python-311` tas bort.
# - En PR som bara ändrar dokument utan betydelse för testerna (samtalsloggar, rapporter och .md i roten) kör inga
#   tester. Jobbet körs ändå, så att den krävda kontrollen rapporteras, men stegen hoppas över.
# - Concurrency: en ny commit på samma PR avbryter den pågående körningen. pip-cache för Pillow.
name: ai-enterprise tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-311:
    name: unittest (Python 3.11)
    if: ${{ false }}  # körs aldrig: finns bara för att den krävda kontrollen ska rapporteras (som överhoppad)
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  unittest:
    name: unittest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-enterprise
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Behöver ändringen tester?
        id: changes
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE"...HEAD || echo "unknown")
          echo "$files"
          relevant=$(echo "$files" | grep -vE '^(ai-enterprise/docs/(conversations|reports|opportunities|bot-reports)/|[^/]+\.md$)' || true)
          if [ -n "$relevant" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "Bara dokument: inga tester behövs." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ai-enterprise-tests.yml
      # D-070 punkt 8: Pillow (HPND) är det enda tillåtna beroendet, och bara i src/aie/pod/design/.
      - name: Install Pillow (only for aie.pod.design)
        if: steps.changes.outputs.run == 'true'
        run: pip install "pillow==12.2.0"
      - name: Run tests
        if: steps.changes.outputs.run == 'true'
        run: python -m unittest discover -s tests -v
