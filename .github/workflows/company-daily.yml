# Fas 8 (masterprompten 2026-10-30): en företagscykel per dygn (§56), gratis.
# - Kör en simulerad dag (SIM) med Groq-agenter om GROQ_API_KEY finns, annars skriptade agenter.
#   Groqs kvot räknas i databasen; när den är slut pausas agenterna.
# - Nödstopp: finns ai-enterprise/docs/KILL-SWITCH slås nödstoppet på i databasen och agenterna gör ingenting.
#   Skyddat läge och stop-loss gäller som vanligt.
# - Command Center (Del 1, D-085, 2026-11-09):
#   * Tillståndet: databasen hämtas ur cachen; saknas den hämtas den krypterade kopian ur Cloudflare KV
#     (scripts/state.sh). Efter körningen sparas den i båda. KV är den auktoritativa platsen (DATA.md avsnitt 7).
#   * Snapshoten publiceras till KV (`python -m aie publish`). Misslyckas det loggas det och nästa körning försöker
#     igen; cykeln räknas inte som misslyckad.
#   * Inget data committas till repot (beslut 8): rapporter, status och grundarnotis sparas som artefakt (14 dagar)
#     och i KV. Tidigare öppnades en daglig PR med docs/reports, status.json och QUESTIONS-FOR-FOUNDERS.md.
# - Publicerar ingenting på GitHub Pages (D-075).
name: company-daily

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Isolerat offline-test: inga nycklar, cacheändringar eller PR:er"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: company-daily
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Två isolerade SIM-dagar utan externa tjänster
        working-directory: ai-enterprise
        run: python scripts/verify_daily_cycle.py

  cycle:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.verify_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ai-enterprise
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bara sim
        run: |
          python -c "from aie.config import load_config; c = load_config('config'); assert c.system.environment == 'sim' and c.risk.currency == 'SIM'"
      - name: Hämta företagets databas
        uses: actions/cache/restore@v4
        with:
          path: ai-enterprise/data
          key: company-${{ github.run_id }}
          restore-keys: company-
      - name: Hämta från KV om cachen saknas
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: bash scripts/state.sh pull company data/sim.db
      - name: Pilotens databas (riktig valuta) till snapshoten, bara läsning
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: bash scripts/state.sh pull pilot data-pilot/data/prod.db
      - name: Företagscykel
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          agents=scripted
          if [ -n "$GROQ_API_KEY" ]; then agents=groq; fi
          python -m aie init
          # Grundarnas beslut som ligger kvar i kön utförs före dagens cykel (D-089). Ett fel här stoppar inte cykeln.
          python -m aie control ingest || true
          mkdir -p "$RUNNER_TEMP/out"
          python -m aie daily-cycle --as robin --agents "$agents" --out "$RUNNER_TEMP/out/reports" \
            --dashboard "$RUNNER_TEMP/out/status.json" --questions "$RUNNER_TEMP/out/QUESTIONS-FOR-FOUNDERS.md" \
            2>&1 | tee "$RUNNER_TEMP/cycle.txt"
      - name: Publicera snapshoten till Command Center
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: python -m aie publish --reports "$RUNNER_TEMP/out/reports" 2>&1 | tee -a "$RUNNER_TEMP/cycle.txt" || true
      - name: Spara den krypterade kopian i KV
        if: always()
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: bash scripts/state.sh push company data/sim.db
      - name: Spara företagets databas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ai-enterprise/data
          key: company-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Sammanfattning
        if: always()
        run: |
          { echo '```'; tail -n 5 "$RUNNER_TEMP/cycle.txt" 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Rapporter som artefakt (inget data i repot)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-daily-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/out/
            ${{ runner.temp }}/cycle.txt
          if-no-files-found: warn
          retention-days: 14
