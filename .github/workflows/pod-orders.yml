# pod-orders (LANSERING-Q4.md, D-070). Läser nya ordrar från Printify varje dygn och bokför dem i pilotens ledger (SEK, prod; aldrig SIM). Databasen följer med mellan körningar via cache.
# Säkerhet: aldrig på pull_request eller pull_request_target, bara i huvudrepot. PRINTIFY_API_TOKEN finns bara i
# steget som anropar Printify och skrivs aldrig ut. Jobbet har bara läsrätt till repot.
name: pod-orders

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pod-orders
  cancel-in-progress: false

jobs:
  run:
    if: github.repository == 'robin100a541-prog/AI-Eco-systems'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ai-enterprise
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta pilotens databas
        uses: actions/cache/restore@v4
        with:
          path: ai-enterprise/data-pilot
          key: pod-orders-${{ github.run_id }}
          restore-keys: pod-orders-
      - name: Printify
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
        run: |
          if [ -z "$PRINTIFY_API_TOKEN" ]; then echo "PRINTIFY_API_TOKEN saknas som repository secret"; exit 1; fi
          python -m aie init
          python -m aie pod orders --as yorgo 2>&1 | tee "$RUNNER_TEMP/pod.txt"
      - name: Spara pilotens databas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ai-enterprise/data-pilot
          key: pod-orders-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Sammanfattning
        if: always()
        run: |
          { echo "## pod-orders $(date -u +%Y-%m-%d)"; echo '```'; cat "$RUNNER_TEMP/pod.txt" 2>/dev/null || echo "kördes inte"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Ladda upp
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pod-orders-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pod.txt
          if-no-files-found: warn
          retention-days: 30
