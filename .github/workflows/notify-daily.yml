# notify-daily (Command Center Del 5, D-091): den dagliga sammanfattningen med e-post.
# - 20:00 UTC, alltså 21:00 svensk vintertid och 22:00 sommartid (GitHubs schema följer inte sommartid).
# - Läser bara snapshoten ur Cloudflare KV. Databasen rörs inte, så körningen kan aldrig krocka med company-daily.
# - Saknas hemligheterna skickas ingenting, utan fel.
name: notify-daily

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: notify-daily
  cancel-in-progress: true

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ai-enterprise
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daglig sammanfattning
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: python -m aie notify daily
